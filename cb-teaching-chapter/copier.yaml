# --------------- #
# -- VARIABLES -- #
# --------------- #

author:
  type   : str
  help   : Author (mandatory data).
  validator: |
    {% if author == ''
       or author != author.strip() %}
      Stripped and not empty!
    {% endif %}

level:
  type   : str
  help   : Level (mandatory data).
  choices:
      - 2G SNT
      - 2G Maths
      - 1G Spé. Maths
      - TG Maths Expertes

chapter_folder:
  type     : str
  help     : Chapter Folder (mandatory data).
  validator: |
    {% if chapter_folder == ''
       or chapter_folder != chapter_folder.strip() %}
      Stripped and not empty!
    {% endif %}

chapter_title:
  type     : str
  help     : Chapter Title (mandatory data).
  validator: |
    {% if chapter_title == ''
       or chapter_title != chapter_title.strip() %}
      Stripped and not empty!
    {% endif %}

manual_folder:
  type   : str
  help   : Manual Folder for Training (mandatory data).
  choices:
      - Barbazo
      - LeLivreScolaire

# No update of any file.
_skip_if_exists:
  - "*"
